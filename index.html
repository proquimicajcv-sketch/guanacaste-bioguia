<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioGuía de Campo - Pacífico Norte (Guanacaste)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen" x-data="guanacasteApp()">

  <!-- Header -->
  <header class="bg-amber-950 border-b border-amber-800 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">Catálogo Oficial ACG / Guanacaste</span>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">☀️ BioGuía Bosque Seco - Gira</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="bg-amber-900 text-amber-200 px-4 py-1.5 rounded-full text-sm font-medium border border-amber-700">
          Registrados: <strong x-text="totalRegistrados"></strong> / <strong x-text="especies.length"></strong>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto p-4 md:p-6">
    
    <!-- Buscador y Filtros -->
    <div class="mb-6 space-y-4">
      <input type="text" x-model="busqueda" placeholder="Buscar especie por nombre científico, común o #ficha (ej. #001, Santa Rosa)..." 
        class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white placeholder-stone-400 focus:outline-none focus:border-amber-500">
      
      <!-- Categorías -->
      <div class="flex flex-wrap gap-2">
        <template x-for="cat in categorias">
          <button @click="categoriaActiva = cat" 
            :class="categoriaActiva === cat ? 'bg-amber-600 text-white' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'"
            class="px-4 py-2 rounded-lg text-sm font-medium transition" x-text="cat"></button>
        </template>
      </div>
    </div>

    <!-- Grid de Especies (Tarjetas Estilo Catálogo) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="esp in especiesFiltradas" :key="esp.id">
        <div class="bg-stone-800 border-2 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between transition hover:border-amber-500"
             :class="esp.registrado ? 'border-emerald-500 bg-stone-800/90' : 'border-stone-700'">
          <div>
            <!-- Cabecera de la Tarjeta -->
            <div class="bg-stone-950 px-4 py-2 border-b border-stone-700 flex justify-between items-center">
              <span class="text-xs font-mono text-amber-400 font-bold" x-text="`${esp.id} • ${esp.ubicacion}`"></span>
              <span class="text-xs px-2 py-0.5 rounded font-semibold"
                    :class="esp.estado.includes('VENENOSA') ? 'bg-red-900 text-red-200' : 'bg-stone-700 text-stone-300'"
                    x-text="esp.estado"></span>
            </div>

            <!-- Imagen Interactiva (Al hacer clic abre el registro GPS y Ficha) -->
            <div @click="abrirRegistroGPS(esp)" class="relative h-48 bg-stone-900 overflow-hidden cursor-pointer group">
              <img :src="esp.imagen" :alt="esp.nombreComun" class="w-full h-full object-cover transition duration-300 group-hover:scale-105">
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white font-semibold text-sm gap-2">
                📍 Toca para Registrar Avistamiento GPS
              </div>
              <span class="absolute bottom-2 right-2 bg-black/70 backdrop-blur text-xs px-2 py-1 rounded text-amber-300 font-medium" x-text="esp.categoria"></span>
            </div>

            <!-- Cuerpo de la Tarjeta -->
            <div class="p-4 space-y-2">
              <h3 class="text-base font-bold text-amber-400 italic" x-text="esp.nombreCientifico"></h3>
              <p class="text-sm font-medium text-stone-100" x-text="esp.nombreComun"></p>
              
              <div class="grid grid-cols-3 gap-1 pt-2 text-[11px] text-stone-300 bg-stone-900/60 p-2 rounded-lg border border-stone-700/50">
                <div><strong class="text-amber-500 block">Hábitat:</strong> <span x-text="esp.habitat"></span></div>
                <div><strong class="text-amber-500 block">Hábitos:</strong> <span x-text="esp.habitos"></span></div>
                <div><strong class="text-amber-500 block">Dieta:</strong> <span x-text="esp.dieta"></span></div>
              </div>
            </div>
          </div>
          
          <!-- Botones de Acción inferior -->
          <div class="p-4 pt-0 flex gap-2 border-t border-stone-700/50 mt-2">
            <button @click="abrirRegistroGPS(esp)" class="flex-1 bg-amber-950 hover:bg-amber-900 text-amber-300 border border-amber-700 py-2 rounded-xl text-xs font-semibold transition text-center">
              📍 Registrar GPS
            </button>
            <button @click="toggleRegistrado(esp.id)" 
              :class="esp.registrado ? 'bg-emerald-700 text-white' : 'bg-stone-700 text-stone-300 hover:bg-stone-600'"
              class="flex-1 py-2 rounded-xl text-xs font-semibold transition text-center"
              x-text="esp.registrado ? '✓ Visto' : '+ Marcar Visto'">
            </button>
          </div>
        </div>
      </template>
    </div>

  </main>

  <!-- Modal de Registro GPS y Observaciones de Campo -->
  <div x-show="modalAbierto" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display: none;">
    <div class="bg-stone-800 border border-stone-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-xs font-mono text-amber-400" x-text="especieSeleccionada.id + ' • ' + especieSeleccionada.ubicacion"></span>
          <h2 class="text-xl font-bold text-white italic" x-text="especieSeleccionada.nombreCientifico"></h2>
          <p class="text-sm text-stone-300" x-text="especieSeleccionada.nombreComun"></p>
        </div>
        <button @click="modalAbierto = false" class="text-stone-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <div class="bg-stone-900 p-4 rounded-xl space-y-2 border border-stone-700 text-xs font-mono text-stone-300">
        <p><strong>📅 Fecha y Hora:</strong> <span x-text="registroActual.fecha"></span></p>
        <p><strong>🌐 Coordenadas GPS:</strong> <span x-text="registroActual.coords">Obteniendo señal GPS...</span></p>
        <p><strong>📍 Precisión:</strong> <span x-text="registroActual.precision"></span></p>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-semibold text-amber-400 uppercase tracking-wider">Notas de Campo / Microclima / Observaciones:</label>
        <textarea x-model="registroActual.observaciones" rows="3" placeholder="Ej. Temperatura de 32°C, humedad alta junto a charca temporal, individuo activo a la sombra..." 
          class="w-full bg-stone-900 border border-stone-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500"></textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <button @click="guardarAvistamiento()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 rounded-xl text-sm transition">
          💾 Guardar Avistamiento con GPS
        </button>
        <button @click="modalAbierto = false" class="bg-stone-700 hover:bg-stone-600 text-stone-300 px-4 py-2.5 rounded-xl text-sm transition">
          Cancelar
        </button>
      </div>
    </div>
  </div>

      { id: "#016", categoria: "Anfibios", nombreCientifico: "Rhinophrynus dorsalis", nombreComun: "Sapo cavador mexicano", estado: "LC (Especial)", ubicacion: "GUANACASTE", habitat: "Suelo arenoso / Subterráneo", habitos: "Fosas subterráneas", dieta: "Especializada en termitas", descripcion: "Anfibio de cuerpo regordete adaptado para cavar de espaldas.", imagen: "https://images.unsplash.com/photo-1574068468729-54a226bc1491?auto=format&fit=crop&w=600&q=80", registrado: false },

    function guanacasteApp() {
      return {
        busqueda: '',
        categoriaActiva: 'Todos',
        categorias: ['Todos', 'Mamíferos', 'Reptiles', 'Anfibios', 'Aves', 'Invertebrados'],
        especies: especiesGuanacaste,
        modalAbierto: false,
        especieSeleccionada: {},
        registroActual: {
          fecha: '',
          coords: '',
          precision: '',
          observaciones: ''
        },
        get totalRegistrados() {
          return this.especies.filter(e => e.registrado).length;
        },
        get especiesFiltradas() {
          return this.especies.filter(esp => {
            const coincideCat = this.categoriaActiva === 'Todos' || esp.categoria === this.categoriaActiva;
            const texto = this.busqueda.toLowerCase();
            const coincideBusqueda = esp.nombreCientifico.toLowerCase().includes(texto) ||
                                     esp.nombreComun.toLowerCase().includes(texto) ||
                                     esp.id.toLowerCase().includes(texto) ||
                                     esp.ubicacion.toLowerCase().includes(texto);
            return coincideCat && coincideBusqueda;
          });
        },
        abrirRegistroGPS(esp) {
          this.especieSeleccionada = esp;
          const ahora = new Date();
          this.registroActual.fecha = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString();
          this.registroActual.coords = 'Obteniendo GPS...';
          this.registroActual.precision = 'Calculando...';
          this.registroActual.observaciones = esp.observacionesCampo || '';
          this.modalAbierto = true;

          // Capturar Geolocalización GPS del Navegador en el celular
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const lat = position.coords.latitude.toFixed(6);
                const lon = position.coords.longitude.toFixed(6);
                const alt = position.coords.altitude ? position.coords.altitude.toFixed(1) + 'm' : 'N/D';
                this.registroActual.coords = `${lat}, ${lon} (Alt: ${alt})`;
                this.registroActual.precision = `${position.coords.accuracy.toFixed(1)} metros`;
              },
              (error) => {
                this.registroActual.coords = 'GPS no disponible (Activa la ubicación)';
                this.registroActual.precision = 'Error: ' + error.message;
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
          } else {
            this.registroActual.coords = 'Geolocalización no soportada por el navegador';
          }
        },
        guardarAvistamiento() {
          const esp = this.especies.find(e => e.id === this.especieSeleccionada.id);
          if (esp) {
            esp.registrado = true;
            esp.observacionesCampo = this.registroActual.observaciones;
            esp.ultimaCaptura = { ...this.registroActual };
            alert(`¡Avistamiento de ${esp.nombreComun} registrado con éxito con datos GPS!`);
          }
          this.modalAbierto = false;
        },
        toggleRegistrado(id) {
          const esp = this.especies.find(e => e.id === id);
          if (esp) {
            esp.registrado = !esp.registrado;
            if (esp.registrado && !esp.ultimaCaptura) {
              const ahora = new Date();
              esp.ultimaCaptura = {
                fecha: ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString(),
                coords: 'Marcado manual sin GPS'
              };
            }
          }
        }
      }
    }
  </script>
</body>
</html>
