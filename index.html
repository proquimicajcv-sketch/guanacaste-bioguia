<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioGuía de Campo - Pacífico Norte (Guanacaste)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen" x-data="guanacasteApp()">

  <!-- Header -->
  <header class="bg-amber-950 border-b border-amber-800 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">Pacífico Norte / Guanacaste</span>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">☀️ BioGuía Bosque Seco</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="bg-amber-900 text-amber-200 px-4 py-1.5 rounded-full text-sm font-medium border border-amber-700">
          Registrados: <strong x-text="totalRegistrados"></strong> / <strong x-text="especies.length"></strong>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto p-4 md:p-6">
    
    <!-- Buscador y Filtros -->
    <div class="mb-6 space-y-4">
      <input type="text" x-model="busqueda" placeholder="Buscar especie por nombre científico, común o #ficha..." 
        class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white placeholder-stone-400 focus:outline-none focus:border-amber-500">
      
      <!-- Categorías -->
      <div class="flex flex-wrap gap-2">
        <button @click="categoriaActiva = 'Todos'" 
          :class="categoriaActiva === 'Todos' ? 'bg-amber-600 text-white' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'"
          class="px-4 py-2 rounded-lg text-sm font-medium transition">Todos</button>
        <button @click="categoriaActiva = 'Reptiles'" 
          :class="categoriaActiva === 'Reptiles' ? 'bg-amber-600 text-white' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'"
          class="px-4 py-2 rounded-lg text-sm font-medium transition">Reptiles</button>
        <button @click="categoriaActiva = 'Anfibios'" 
          :class="categoriaActiva === 'Anfibios' ? 'bg-amber-600 text-white' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'"
          class="px-4 py-2 rounded-lg text-sm font-medium transition">Anfibios</button>
        <button @click="categoriaActiva = 'Mamíferos'" 
          :class="categoriaActiva === 'Mamíferos' ? 'bg-amber-600 text-white' : 'bg-stone-800 text-stone-300 hover:bg-stone-700'"
          class="px-4 py-2 rounded-lg text-sm font-medium transition">Mamíferos</button>
      </div>
    </div>

    <!-- Grid de Especies -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="esp in especiesFiltradas" :key="esp.id">
        <div class="bg-stone-800 border border-stone-700 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between transition hover:border-amber-600">
          <div>
            <div class="relative h-56 bg-stone-900 overflow-hidden">
              <img :src="esp.imagen" :alt="esp.nombreComun" class="w-full h-full object-cover">
              <span class="absolute top-3 right-3 bg-stone-900/80 backdrop-blur text-xs px-2.5 py-1 rounded-md font-mono border border-stone-700" x-text="esp.estado"></span>
            </div>
            <div class="p-4 space-y-2">
              <div class="flex justify-between items-center text-xs text-stone-400 font-mono">
                <span x-text="`#${esp.id} • ${esp.categoria}`"></span>
              </div>
              <h3 class="text-lg font-bold text-amber-400 italic" x-text="esp.nombreCientifico"></h3>
              <p class="text-sm font-medium text-stone-200" x-text="esp.nombreComun"></p>
              <p class="text-xs text-stone-400 line-clamp-2" x-text="esp.descripcion"></p>
            </div>
          </div>
          
          <!-- Botones de Acción -->
          <div class="p-4 pt-0 flex gap-2 border-t border-stone-700/50 mt-4">
            <button @click="abrirFicha(esp)" class="flex-1 bg-stone-700 hover:bg-stone-600 py-2 rounded-xl text-xs font-semibold transition text-center">
              🔍 Ficha
            </button>
            <button @click="toggleRegistrado(esp.id)" 
              :class="esp.registrado ? 'bg-amber-700 text-white' : 'bg-amber-950 text-amber-300 border border-amber-700'"
              class="flex-1 py-2 rounded-xl text-xs font-semibold transition text-center"
              x-text="esp.registrado ? '✓ Registrado' : '+ Registrar'">
            </button>
          </div>
        </div>
      </template>
    </div>

  </main>

  <!-- Script de Lógica -->
  <script>
    const especiesGuanacaste = [
      {
        id: "001",
        categoria: "Reptiles",
        nombreCientifico: "Ctenosaura similis",
        nombreComun: "Garrobo / Iguana negra",
        estado: "LC",
        habito: "Diurna / Terrestre",
        dieta: "Omnívora",
        descripcion: "El lagarto más rápido del mundo. Muy común en zonas secas y rocosas de Guanacaste.",
        imagen: "https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?auto=format&fit=crop&w=600&q=80",
        registrado: false
      },
      {
        id: "002",
        categoria: "Anfibios",
        nombreCientifico: "Smilisca baudinii",
        nombreComun: "Ranita arborícola mexicana",
        estado: "LC",
        habito: "Nocturna / Arborícola",
        dieta: "Insectívora",
        descripcion: "Habita en charcas temporales durante la época lluviosa. Cambia de color según la temperatura.",
        imagen: "https://images.unsplash.com/photo-1574068468729-54a226bc1491?auto=format&fit=crop&w=600&q=80",
        registrado: false
      },
      {
        id: "003",
        categoria: "Reptiles",
        nombreCientifico: "Crotalus simus",
        nombreComun: "Cascabel centroamericana",
        estado: "LC",
        habito: "Nocturna / Terrestre",
        dieta: "Carnívora",
        descripcion: "Serpiente venenosa de sabanas y bosques secos. Posee un característico cascabel en la cola.",
        imagen: "https://images.unsplash.com/photo-1562332213-31fbb830f980?auto=format&fit=crop&w=600&q=80",
        registrado: false
      },
      {
        id: "004",
        categoria: "Mamíferos",
        nombreCientifico: "Alouatta palliata",
        nombreComun: "Mono congo",
        estado: "VU",
        habito: "Diurna / Arborícola",
        dieta: "Frugívora / Folívora",
        descripcion: "Famosos por sus potentes aullidos matutinos. Viven en tropas en los árboles de la bajura.",
        imagen: "https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?auto=format&fit=crop&w=600&q=80",
        registrado: false
      }
    ];

    function guanacasteApp() {
      return {
        busqueda: '',
        categoriaActiva: 'Todos',
        especies: especiesGuanacaste,
        get totalRegistrados() {
          return this.especies.filter(e => e.registrado).length;
        },
        get especiesFiltradas() {
          return this.especies.filter(esp => {
            const coincideCat = this.categoriaActiva === 'Todos' || esp.categoria === this.categoriaActiva;
            const texto = this.busqueda.toLowerCase();
            const coincideBusqueda = esp.nombreCientifico.toLowerCase().includes(texto) ||
                                     esp.nombreComun.toLowerCase().includes(texto) ||
                                     esp.id.includes(texto);
            return coincideCat && coincideBusqueda;
          });
        },
        toggleRegistrado(id) {
          const esp = this.especies.find(e => e.id === id);
          if (esp) esp.registrado = !esp.registrado;
        },
        abrirFicha(esp) {
          alert(`Ficha Técnica:\n\nEspecie: ${esp.nombreCientifico} (${esp.nombreComun})\nHábito: ${esp.habito}\nDieta: ${esp.dieta}\n\nDescripción: ${esp.descripcion}`);
        }
      }
    }
  </script>
</body>
</html>
